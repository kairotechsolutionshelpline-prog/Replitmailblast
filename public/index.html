<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailBlast — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #080810;
      position: relative;
      overflow: hidden;
    }

    .bg-blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: blobPulse 10s ease-in-out infinite alternate;
      filter: blur(1px);
    }
    .blob-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,102,247,0.18) 0%, transparent 60%);
      top: -200px; left: -180px;
    }
    .blob-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(139,92,246,0.14) 0%, transparent 60%);
      bottom: -150px; right: -150px;
      animation-delay: -5s;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 60%);
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      animation-delay: -2.5s;
    }
    @keyframes blobPulse {
      0%   { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(15px, 10px); }
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      background: rgba(12, 12, 22, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 42px 38px 36px;
      box-shadow:
        0 0 0 1px rgba(79,102,247,0.06) inset,
        0 30px 80px rgba(0,0,0,0.7),
        0 1px 0 rgba(255,255,255,0.05) inset;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.6), transparent);
      border-radius: 1px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 36px;
    }
    .logo-img-wrap {
      width: 46px; height: 46px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #4f66f7 0%, #7c3aed 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(79,102,247,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
      flex-shrink: 0;
    }
    .logo-text { font-size: 20px; font-weight: 800; color: #eeeeff; letter-spacing: -0.5px; }
    .logo-sub  { font-size: 11px; color: #44445a; margin-top: 2px; letter-spacing: 0.2px; }

    h1 {
      font-size: 24px; font-weight: 800;
      color: #f0f0fc; letter-spacing: -0.6px; margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13.5px; color: #4a4a60;
      margin-bottom: 30px; line-height: 1.5;
    }

    .err {
      display: none; align-items: center; gap: 9px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.22);
      color: #f87171;
      border-radius: 11px; padding: 11px 14px;
      font-size: 13px; margin-bottom: 18px;
    }
    .err.show { display: flex; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: #40405a; margin-bottom: 8px;
    }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #30304a; line-height: 0; pointer-events: none;
      transition: color 0.15s; order: 1;
    }
    input[type="email"], input[type="password"] {
      width: 100%; order: 2;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px;
      padding: 13px 14px 13px 44px;
      font-size: 14px; color: #e8e8f5;
      font-family: inherit; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input::placeholder { color: #28283c; }
    input:focus {
      border-color: rgba(99,102,241,0.55);
      background: rgba(99,102,241,0.05);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .input-wrap:focus-within .input-icon { color: #6366f1; }

    button[type="submit"] {
      width: 100%; margin-top: 6px;
      background: linear-gradient(135deg, #4f66f7 0%, #7c3aed 100%);
      color: white; border: none;
      border-radius: 11px; padding: 14px;
      font-size: 14.5px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 8px 24px rgba(79,102,247,0.4), 0 1px 0 rgba(255,255,255,0.12) inset;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button[type="submit"]:hover:not(:disabled) {
      opacity: 0.92;
      box-shadow: 0 12px 32px rgba(79,102,247,0.55), 0 1px 0 rgba(255,255,255,0.12) inset;
      transform: translateY(-1px);
    }
    button[type="submit"]:active:not(:disabled) { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }

    .spin {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.65s linear infinite; display: none;
    }
    button.loading .spin { display: block; }
    button.loading .btn-lbl { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .foot {
      margin-top: 22px; text-align: center;
      font-size: 11.5px; color: #1e1e30;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .foot::before, .foot::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.04);
    }

    .powered {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: #1a1a28; white-space: nowrap; z-index: 2;
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-img-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">MailBlast</div>
        <div class="logo-sub">Bulk Email Platform</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your admin dashboard</p>

    <div class="err" id="errBox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errText"></span>
    </div>

    <form id="form" autocomplete="on">
      <div class="field">
        <label for="emailInput">Email address</label>
        <div class="input-wrap">
          <div class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <input type="email" id="emailInput" name="email" placeholder="admin@yourcompany.com" required autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="passInput">Password</label>
        <div class="input-wrap">
          <div class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <input type="password" id="passInput" name="password" placeholder="••••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <div class="spin"></div>
        <span class="btn-lbl">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:4px;margin-bottom:1px;">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Sign in to Dashboard
        </span>
      </button>
    </form>

    <div class="foot">Admin access only</div>
  </div>

  <div class="powered">MailBlast &nbsp;&middot;&nbsp; Powered by Resend</div>

  <script>
    fetch('/api/me').then(r => r.json()).then(d => {
      if (d.authenticated) window.location.replace('/dashboard');
    }).catch(() => {});

    const form = document.getElementById('form');
    const btn  = document.getElementById('submitBtn');
    const err  = document.getElementById('errBox');
    const errT = document.getElementById('errText');

    function showErr(msg) { errT.textContent = msg; err.classList.add('show'); }
    function hideErr()    { err.classList.remove('show'); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideErr();
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            email:    document.getElementById('emailInput').value.trim(),
            password: document.getElementById('passInput').value
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          // Note 11: Store prunedCount so dashboard can show the admin toast
          if (data.prunedCount > 0) {
            sessionStorage.setItem('mb_pruned', data.prunedCount);
          }
          window.location.replace('/dashboard');
        } else {
          showErr(data.error || 'Login failed. Check your credentials.');
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      } catch {
        showErr('Network error — please try again.');
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
